; XIAO ESP32-S3 IMU timestamping bridge
; ICM-42688-P over SPI, 200 Hz, per-sample microsecond timestamps, binary USB-CDC out.
; Build/flash:  pio run -t upload
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
