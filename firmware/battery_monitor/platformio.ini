; Waveshare ESP32-C6-LCD-1.47 battery monitor (INA226 + ST7789)
;
; The stock PlatformIO espressif32 platform (7.0.1 here) pins the Arduino
; core to 2.0.17, which predates the ESP32-C6 -- its own C6 board definition
; lists frameworks: ['espidf'] only. The pioarduino fork carries
; arduino-esp32 3.x, which does support C6. That is why the platform is a
; URL rather than a version number.
;
; Build/flash:  pio run -t upload
[env:esp32-c6-lcd-1_47]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
