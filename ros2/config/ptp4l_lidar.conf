# ptp4l master config for the Pandar40P link on enp4s0.
#
#   sudo ptp4l -f ~/pandar-40p/ros2/config/ptp4l_lidar.conf -m
#
# Why each setting:
#
# time_stamping software
#   enp4s0 is a Realtek r8169 and `ethtool -T enp4s0` reports
#   "PTP Hardware Clock: none" with no hardware TX/RX timestamp modes.
#   Hardware PTP is not available on this machine, so this is software
#   timestamping and the achievable sync is tens of microseconds rather
#   than the sub-microsecond a proper PTP NIC would give.
#
# masterOnly 1 / priority1 127
#   Both the laptop and a free-running lidar advertise clockClass 248, so
#   the BMCA tie would be broken by clock identity (MAC address) and the
#   lidar could win, which is backwards. masterOnly pins the port to
#   master, and priority1 127 (better than the default 128) makes it win
#   the comparison regardless.
#
# domainNumber 0, network_transport UDPv4, logAnnounceInterval 1,
# logSyncInterval 1
#   Matched to the lidar's own PTPConfig, read from the console:
#   {"Domain":0,"Network":0,"LogAnnounceInterval":1,"LogSyncInterval":1,
#    "LogMinDelayReqInterval":0}   -- Network 0 means UDP/IP.

[global]
time_stamping           software
network_transport       UDPv4
delay_mechanism         E2E
domainNumber            0
priority1               127
priority2               128
clockClass              248
logAnnounceInterval     1
logSyncInterval         1
logMinDelayReqInterval  0
summary_interval        0
tx_timestamp_timeout    50

[enp4s0]
masterOnly              1
